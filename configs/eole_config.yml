# EOLE Training Configuration for English-Hindi MT
# Lexical and Syntactic Transfer Model

## IO
save_data: data/eole_vocab
overwrite: True
seed: 1234
report_every: 100
valid_metrics: ["BLEU"]
tensorboard: true
tensorboard_log_dir: logs/tensorboard
log_file: logs/eole_train.log

### Vocab
src_vocab: models/spm.en.vocab
tgt_vocab: models/spm.hi.vocab
src_vocab_size: 32000
tgt_vocab_size: 32000
vocab_size_multiple: 8
src_words_min_frequency: 1
tgt_words_min_frequency: 1
n_sample: 0

# Data paths
data:
    corpus_1:
        path_src: data/train.en
        path_tgt: data/train.hi
        weight: 1
    valid:
        path_src: data/dev.en
        path_tgt: data/dev.hi

# Transforms configuration
transforms: [sentencepiece, filtertoolong]
transforms_configs:
  sentencepiece:
    src_subword_model: "models/spm.en.model"
    tgt_subword_model: "models/spm.hi.model"
  filtertoolong:
    src_seq_length: 200
    tgt_seq_length: 200

# Training parameters
training:
    # Run configuration
    model_path: models/eole_model
    keep_checkpoint: 10
    save_checkpoint_steps: 5000
    train_steps: 2000
    valid_steps: 5000
    early_stopping: 0
    early_stopping_criteria: null

    # Train on a single GPU
    world_size: 1
    gpu_ranks: [0]

    # Batching
    batch_type: "tokens"
    batch_size: 2048
    valid_batch_size: 1024
    batch_size_multiple: 1
    accum_count: [8]
    accum_steps: [0]

    # Optimizer & Compute
    optim: "adam"
    learning_rate: 2.0
    warmup_steps: 8000
    decay_method: "noam"
    adam_beta1: 0.9
    adam_beta2: 0.998

    # Hyperparams
    dropout_steps: [0]
    dropout: [0.1]
    attention_dropout: [0.1]
    max_grad_norm: 0.0
    label_smoothing: 0.1
    param_init_method: xavier_uniform
    normalization: "tokens"

# Model architecture - Transformer
model:
    architecture: "transformer"
    hidden_size: 512
    layers: 6
    heads: 8
    transformer_ff: 2048
    embeddings:
        word_vec_size: 512
        position_encoding_type: "SinusoidalInterleaved"
